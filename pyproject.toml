[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "octatools"
version = "0.1.0"
description = "Quality control, preprocessing, FAZ and vessel segmentation, and biomarkers for en-face OCTA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dharini Raghavan" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
deep = ["torch>=2.0", "monai>=1.3"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
octatools = "octatools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["deep: needs torch and monai", "network: needs internet access"]
